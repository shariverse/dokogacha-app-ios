# Archive → IPA Export（→ App Store Connect へアップロード）の共通処理。
# archive.yml / upload.yml から workflow_call で呼び出される。
#
# 認証はすべて App Store Connect API Key で行う（Apple ID / App 用パスワードは使わない）。
# アップロードは ExportOptions.plist の destination を upload にした xcodebuild -exportArchive で行う。
name: _archive

on:
  workflow_call:
    inputs:
      xcode-version:
        description: maxim-lobanov/setup-xcode に渡す Xcode バージョン
        type: string
        # README の Environment と揃える。ランナー側の更新でビルドが変わらないよう固定する
        default: '26.6'
      upload:
        description: Export した IPA を App Store Connect へアップロードするか
        type: boolean
        default: false
      configuration:
        description: Archive するビルド構成（Stg = TestFlight 用で Firebase は dev / Release = App Store 用で Firebase は prod）
        type: string
        default: Release
    secrets:
      EXPORT_OPTIONS:
        description: ExportOptions.plist の内容（destination と、アップロード時の manageAppVersionAndBuildNumber はワークフロー側で上書きする）
        required: true
      APPLE_API_KEY_BASE64:
        description: App Store Connect API Key（.p8）を base64 エンコードしたもの
        required: true
      APPLE_API_KEY_ID:
        description: App Store Connect API Key の Key ID
        required: true
      APPLE_API_ISSUER_ID:
        description: App Store Connect API Key の Issuer ID
        required: true
      GOOGLE_SERVICE_INFO_PLIST_DEV:
        description: Firebase の dev プロジェクトの GoogleService-Info.plist を base64 エンコードしたもの（Stg 構成で使う。未登録なら書き出さない）
        required: false
      GOOGLE_SERVICE_INFO_PLIST_PROD:
        description: Firebase の prod プロジェクトの GoogleService-Info.plist を base64 エンコードしたもの（Release 構成で使う。未登録なら書き出さない）
        required: false

jobs:
  archive:
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ inputs.xcode-version }}

      - name: Checkout
        uses: actions/checkout@v7

      - name: Allow SwiftLint build tool plugin
        run: defaults write com.apple.dt.Xcode IDESkipPackagePluginFingerprintValidatation -bool YES

      - name: Set up environment
        # プロジェクト名と同名の共有スキームが存在することを前提にする。
        # ExportOptions.plist と API 秘密鍵はリポジトリ配下ではなく RUNNER_TEMP に置く
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          CONFIGURATION: ${{ inputs.configuration }}
        run: |
          case "$CONFIGURATION" in
            Stg | Release) ;;
            *)
              echo "::error::configuration は Stg か Release を指定してください（指定: ${CONFIGURATION}）" >&2
              exit 1
              ;;
          esac
          project=$(basename -s .xcodeproj ./*.xcodeproj)
          {
            echo "PROJECT_NAME=$project"
            echo "SCHEME=$project"
            echo "CONFIGURATION=$CONFIGURATION"
            echo "EXPORT_OPTIONS_PATH=$RUNNER_TEMP/ExportOptions.plist"
            echo "API_KEY_PATH=$RUNNER_TEMP/private_keys/AuthKey_$APPLE_API_KEY_ID.p8"
          } >> "$GITHUB_ENV"
          echo "project=$project scheme=$project configuration=$CONFIGURATION"

      - name: Write GoogleService-Info plist
        # Archive する構成の plist だけを Secrets から書き出す（Stg = Dev / Release = Prod。もう一方は xcconfig の EXCLUDED_SOURCE_FILE_NAMES でアプリに入らない）。
        # Secret が未登録なら書き出さずに進む。アプリは plist が無くても起動し、サーバーに接続できない状態になる（Discussion #5 の Q5）。
        # ただし App Store にアップロードする Release は、サーバーに繋がらないアプリを出さないよう止める。
        # Secrets はシェル展開ではなく env 経由で渡し、中身はログに出さない
        env:
          GOOGLE_SERVICE_INFO_PLIST_DEV: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_DEV }}
          GOOGLE_SERVICE_INFO_PLIST_PROD: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_PROD }}
          UPLOAD: ${{ inputs.upload }}
        run: |
          if [[ "$CONFIGURATION" == "Release" ]]; then
            name=GoogleService-Info-Prod
            secret_name=GOOGLE_SERVICE_INFO_PLIST_PROD
            encoded=$GOOGLE_SERVICE_INFO_PLIST_PROD
          else
            name=GoogleService-Info-Dev
            secret_name=GOOGLE_SERVICE_INFO_PLIST_DEV
            encoded=$GOOGLE_SERVICE_INFO_PLIST_DEV
          fi
          destination="$PROJECT_NAME/Resources/Firebase/$name.plist"
          if [[ -z "$encoded" ]]; then
            message="Secret ${secret_name} が無いため ${name}.plist を書き出さずに Archive します（このアプリは Firebase に接続できません）"
            if [[ "$CONFIGURATION" == "Release" && "$UPLOAD" == "true" ]]; then
              echo "::error::${message}。App Store 用の Release はアップロードしません" >&2
              exit 1
            fi
            echo "::warning::${message}"
            echo "> [!WARNING]" >> "$GITHUB_STEP_SUMMARY"
            echo "> ${message}" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          mkdir -p "$(dirname "$destination")"
          if ! printf '%s' "$encoded" | base64 --decode > "$destination" 2>/dev/null || ! plutil -lint -s "$destination" >/dev/null 2>&1; then
            rm -f "$destination"
            echo "::error::Secret ${secret_name} を plist として読めません。GoogleService-Info.plist を base64 にした値を登録してください" >&2
            exit 1
          fi
          echo "$destination を書き出しました"

      - name: Archive
        run: |
          xcodebuild archive \
            -project "$PROJECT_NAME.xcodeproj" \
            -scheme "$SCHEME" \
            -sdk iphoneos \
            -configuration "$CONFIGURATION" \
            -archivePath "$RUNNER_TEMP/build.xcarchive" \
            CODE_SIGNING_ALLOWED=NO

      - name: Verify Firebase settings in the app
        # 構成と Firebase の接続先の取り違え（Stg のつもりで prod に繋ぐなど）を、Export・アップロードの前に止める。
        # Info.plist の DGFirebaseEnvironment・DGFirebaseOptionsFileName が構成どおりか、もう一方の構成の plist が入っていないか、
        # 書き出した plist がアプリに入ったかを確かめる（plist の中身は読まない・出さない）
        run: |
          if [[ "$CONFIGURATION" == "Release" ]]; then
            expected_environment=prod
            expected_name=GoogleService-Info-Prod
            other_name=GoogleService-Info-Dev
          else
            expected_environment=dev
            expected_name=GoogleService-Info-Dev
            other_name=GoogleService-Info-Prod
          fi
          app_path=$(/usr/libexec/PlistBuddy -c 'Print :ApplicationProperties:ApplicationPath' "$RUNNER_TEMP/build.xcarchive/Info.plist")
          app="$RUNNER_TEMP/build.xcarchive/Products/$app_path"
          environment=$(plutil -extract DGFirebaseEnvironment raw -o - "$app/Info.plist")
          options_name=$(plutil -extract DGFirebaseOptionsFileName raw -o - "$app/Info.plist")
          echo "configuration=$CONFIGURATION DGFirebaseEnvironment=$environment DGFirebaseOptionsFileName=$options_name"
          if [[ "$environment" != "$expected_environment" || "$options_name" != "$expected_name" ]]; then
            echo "::error::${CONFIGURATION} のアプリの Firebase の設定が想定と違います（DGFirebaseEnvironment は ${expected_environment}、DGFirebaseOptionsFileName は ${expected_name} のはず）" >&2
            exit 1
          fi
          if [[ -e "$app/$other_name.plist" ]]; then
            echo "::error::${CONFIGURATION} のアプリに ${other_name}.plist が入っています" >&2
            exit 1
          fi
          if [[ -f "$PROJECT_NAME/Resources/Firebase/$expected_name.plist" ]]; then
            if [[ ! -f "$app/$expected_name.plist" ]]; then
              echo "::error::書き出した ${expected_name}.plist がアプリに入っていません" >&2
              exit 1
            fi
            echo "$expected_name.plist がアプリに入っています"
          else
            echo "$expected_name.plist は無いので、このアプリは Firebase に接続できません"
          fi

      - name: Create ExportOptions.plist and API private key
        # Secrets はシェル展開ではなく env 経由で渡す
        env:
          EXPORT_OPTIONS: ${{ secrets.EXPORT_OPTIONS }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          printf '%s' "$EXPORT_OPTIONS" > "$EXPORT_OPTIONS_PATH"
          plutil -lint "$EXPORT_OPTIONS_PATH"
          mkdir -p "$(dirname "$API_KEY_PATH")"
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 --decode > "$API_KEY_PATH"

      - name: Export IPA
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          plutil -replace destination -string export "$EXPORT_OPTIONS_PATH"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/build.xcarchive" \
            -exportOptionsPlist "$EXPORT_OPTIONS_PATH" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$API_KEY_PATH" \
            -authenticationKeyID "$APPLE_API_KEY_ID" \
            -authenticationKeyIssuerID "$APPLE_API_ISSUER_ID"

      - name: Upload IPA to GitHub
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PROJECT_NAME }}.ipa
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: error

      - name: Check app exists in App Store Connect
        # App Store Connect にアプリが無いと、アップロードが "Error Downloading App Information" で失敗し原因が分かりにくい。
        # アプリの作成は API でできないため、ここでは読み取りだけで確認し、無ければ作成手順を Job Summary に出して止める。
        # Bundle ID は直前の Export で Developer Portal に登録済みなので、この時点で Web 画面から選べる
        if: ${{ inputs.upload }}
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :ApplicationProperties:CFBundleIdentifier' "$RUNNER_TEMP/build.xcarchive/Info.plist") \
          APP_NAME="$PROJECT_NAME" \
            ruby .github/scripts/check-app-store-app.rb

      - name: Set up TestFlight internal testers
        # 内部テストグループ（すべてのビルドを自動配信）を用意し、変数 TESTFLIGHT_INTERNAL_TESTERS のメールアドレスを内部テスターに入れる。
        # アップロードより前に済ませておくと、このあとのビルドも処理が終わりしだい配信される。2 回目以降は確認だけで何もしない。
        # テスターの設定に失敗してもアップロードは止めない（Job Summary と注釈で知らせる）
        if: ${{ inputs.upload }}
        continue-on-error: true
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          TESTERS: ${{ vars.TESTFLIGHT_INTERNAL_TESTERS }}
        run: |
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :ApplicationProperties:CFBundleIdentifier' "$RUNNER_TEMP/build.xcarchive/Info.plist") \
            ruby .github/scripts/ensure-internal-testers.rb

      - name: Upload to App Store Connect
        # ビルド番号は Xcode に採番させる（manageAppVersionAndBuildNumber）。App Store Connect 上の最新ビルド番号を見て
        # 自動で増やすので、xcconfig の CURRENT_PROJECT_VERSION を手で上げる必要はない。
        # org 共有の EXPORT_OPTIONS Secret は他リポジトリでも使うため書き換えず、ランナー上のコピーだけを上書きする
        if: ${{ inputs.upload }}
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          plutil -replace destination -string upload "$EXPORT_OPTIONS_PATH"
          plutil -replace manageAppVersionAndBuildNumber -bool YES "$EXPORT_OPTIONS_PATH"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/build.xcarchive" \
            -exportOptionsPlist "$EXPORT_OPTIONS_PATH" \
            -exportPath "$RUNNER_TEMP/upload" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$API_KEY_PATH" \
            -authenticationKeyID "$APPLE_API_KEY_ID" \
            -authenticationKeyIssuerID "$APPLE_API_ISSUER_ID"
