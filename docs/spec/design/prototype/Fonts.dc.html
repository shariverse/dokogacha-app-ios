<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>ドコガチャ フォント案</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&amp;family=M+PLUS+Rounded+1c:wght@400;700;800&amp;family=Mochiy+Pop+One&amp;family=Zen+Maru+Gothic:wght@400;700&amp;family=Yusei+Magic&amp;family=Zen+Kaku+Gothic+New:wght@400;700;900&amp;family=Kaisei+Decol:wght@700&amp;family=DotGothic16&amp;display=swap">
<style>
body{margin:0}
a{color:#B8321A}a:hover{color:#8F2412}
</style>
</helmet>
<div style="width: 2620px; height: 960px; box-sizing: border-box; padding: 40px; display: flex; gap: 40px; background: #F3E9DD; color: #2B2118; font-family: 'M PLUS Rounded 1c', sans-serif;">
  <sc-for list="{{sets}}" as="f" hint-placeholder-count="6">
    <div style="width: 390px; flex-shrink: 0; display: flex; flex-direction: column; gap: 14px;">
      <div style="height: 96px; display: flex; flex-direction: column; gap: 4px;">
        <div style="display: flex; align-items: center; gap: 8px;">
          <span style="font-size: 12px; font-weight: 800; padding: 2px 8px; border-radius: 6px; background: #2B2118; color: #FFC93C;">{{f.key}}</span>
          <span style="font-size: 22px; font-family: {{f.display}}; font-weight: {{f.dw}};">{{f.name}}</span>
        </div>
        <span style="font-size: 12px; color: #6E5E50;">見出し：{{f.displayName}} ／ 本文：{{f.bodyName}}</span>
        <span style="font-size: 13px; line-height: 1.5;">{{f.taste}}</span>
      </div>

      <div style="height: 770px; border: 2.5px solid #2B2118; border-radius: 36px; background: #FFF7EE; overflow: hidden; padding: 28px 16px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px; font-family: {{f.body}};">
        <div style="display: flex; flex-direction: column; gap: 4px;">
          <div style="display: flex; align-items: center; gap: 10px;">
            <span aria-hidden="true" style="width: 30px; height: 30px; border-radius: 15px; border: 3px solid #2B2118; box-sizing: border-box; background: linear-gradient(180deg, #D93A1F 50%, #ffffff 50%);"></span>
            <span style="font-size: 30px; letter-spacing: 0.02em; font-family: {{f.display}}; font-weight: {{f.dw}};">ドコガチャ</span>
          </div>
          <span style="font-size: 12px; font-weight: 700; color: #6E5E50;">友達旅行・おでかけの行き先ガチャ</span>
        </div>

        <div style="display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 12px; background: #2B2118; color: #FFC93C;">
          <span style="font-size: 11px; font-weight: 700; color: #F3E3CF;">行き先</span>
          <span style="font-size: 22px; letter-spacing: 0.2em; flex: 1; font-family: {{f.display}}; font-weight: {{f.dw}};">？？？</span>
          <span style="font-size: 12px; color: #F3E3CF;">カプセル <strong style="color: #FFC93C;">8</strong>個</span>
        </div>

        <div style="display: flex; align-items: baseline; gap: 8px; margin-top: 2px;">
          <span style="font-size: 18px; font-family: {{f.display}}; font-weight: {{f.dw}};">候補</span>
          <span style="font-size: 12px; color: #6E5E50;">8件 · 新しい順</span>
        </div>

        <div style="position: relative; margin-top: 6px; border-radius: 18px; padding: 20px 14px 14px; display: flex; flex-direction: column; gap: 12px; background: #FFF1C9; border: 2.5px solid #2B2118; box-shadow: 0 4px 0 #2B2118;">
          <span style="position: absolute; top: -13px; left: 14px; display: flex; align-items: center; gap: 4px; font-size: 12px; padding: 3px 10px; border-radius: 8px; background: #2B2118; color: #FFC93C; font-family: {{f.display}}; font-weight: {{f.dw}};">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.6 7.1L12 17.3 5.8 21l1.6-7.1L2 9.2l7.1-.6Z"></path></svg>
            全員いいね
          </span>
          <div style="display: flex; gap: 12px; align-items: flex-start;">
            <span aria-hidden="true" style="width: 52px; height: 52px; border-radius: 14px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: #DDF3E6; color: #1E6B47;">
              <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M2 20 9 7l4 7 3-4 6 10Z M7 10.5l2 1.5 2-1.5"></path></svg>
            </span>
            <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px;">
              <span style="font-size: 16px; font-weight: 700;">高尾山</span>
              <span style="font-size: 12px; color: #6E5E50;">東京・八王子市 · 自然・ハイキング</span>
              <span style="font-size: 13px; background: #ffffff; border-radius: 4px 12px 12px 12px; padding: 6px 10px; align-self: flex-start;">紅葉シーズンにちょうどいい</span>
              <span style="font-size: 12px; color: #6E5E50;">みさきさんの投稿 · 3日前</span>
            </div>
            <span style="min-width: 52px; height: 52px; border-radius: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #FDE3DC; color: #B8321A; font-size: 11px; font-weight: 700;">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="#B8321A" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"></path></svg>
              いいね済
            </span>
          </div>
          <div style="display: flex; align-items: center; gap: 8px;">
            <div style="display: flex; padding-left: 6px;">
              <span style="width: 26px; height: 26px; margin-left: -6px; border-radius: 13px; border: 2px solid #FFF1C9; box-sizing: border-box; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; background: #23775D; color: #ffffff;">ゆ</span>
              <span style="width: 26px; height: 26px; margin-left: -6px; border-radius: 13px; border: 2px solid #FFF1C9; box-sizing: border-box; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; background: #2F6FD0; color: #ffffff;">け</span>
              <span style="width: 26px; height: 26px; margin-left: -6px; border-radius: 13px; border: 2px solid #FFF1C9; box-sizing: border-box; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; background: #6B48C9; color: #ffffff;">そ</span>
              <span style="width: 26px; height: 26px; margin-left: -6px; border-radius: 13px; border: 2px solid #FFF1C9; box-sizing: border-box; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; background: #B8321A; color: #ffffff;">あ</span>
            </div>
            <span style="font-size: 20px; color: #B8321A; font-family: {{f.display}}; font-weight: {{f.dw}};">4</span>
            <span style="font-size: 13px; font-weight: 700; margin-left: -4px;">人がいいね</span>
          </div>
          <div style="display: flex; align-items: center; gap: 10px; padding-top: 10px; border-top: 2px dashed #E3D3C2;">
            <span style="font-size: 12px; font-weight: 700; padding: 4px 8px; border-radius: 8px; white-space: nowrap; background: #D93A1F; color: #ffffff;">出やすい</span>
            <div style="flex: 1; height: 12px; border-radius: 6px; background: #F1E4D6; overflow: hidden;">
              <div style="height: 100%; width: 100%; border-radius: 6px; background: #D93A1F;"></div>
            </div>
            <span style="font-size: 24px; min-width: 58px; text-align: right; color: #B8321A; font-family: {{f.display}}; font-weight: {{f.dw}};">16<span style="font-size: 13px;">%</span></span>
          </div>
        </div>

        <div style="position: relative; margin-top: 4px; background: #ffffff; border: 2.5px solid #2B2118; border-radius: 18px; overflow: hidden; box-shadow: 0 4px 0 #2B2118;">
          <div style="background: #D93A1F; color: #ffffff; padding: 9px 16px; display: flex; align-items: center; gap: 8px;">
            <span style="font-size: 15px; flex: 1; font-family: {{f.display}}; font-weight: {{f.dw}};">行き先きっぷ</span>
            <span style="font-size: 12px; font-weight: 700;">11月の日帰り旅行</span>
          </div>
          <div style="padding: 16px 86px 16px 18px; display: flex; flex-direction: column; gap: 6px;">
            <span style="font-size: 28px; line-height: 1.3; font-family: {{f.display}}; font-weight: {{f.dw}};">高尾山 <span style="font-size: 15px;">ゆき</span></span>
            <span style="font-size: 12px; color: #6E5E50;">東京・八王子市 · 自然・ハイキング</span>
          </div>
          <span aria-hidden="true" style="position: absolute; right: 14px; top: 46px; width: 64px; height: 64px; border-radius: 32px; border: 3px solid #B8321A; color: #B8321A; display: flex; flex-direction: column; align-items: center; justify-content: center; transform: rotate(-14deg);">
            <span style="font-size: 17px; line-height: 1; font-family: {{f.display}}; font-weight: {{f.dw}};">決定</span>
            <span style="font-size: 9px; font-weight: 700; margin-top: 3px;">10.21</span>
          </span>
        </div>

        <div style="flex: 1;"></div>
        <span style="height: 56px; border: 2.5px solid #2B2118; border-radius: 18px; background: #D93A1F; color: #ffffff; font-size: 17px; font-weight: 700; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 0 #2B2118;">ガチャを回す</span>
      </div>
    </div>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":2620,"height":960}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      sets: [
        {
          key: '現行',
          name: 'ポスター×まる文字',
          display: "'Dela Gothic One', sans-serif", dw: 400, displayName: 'Dela Gothic One',
          body: "'M PLUS Rounded 1c', sans-serif", bodyName: 'M PLUS Rounded 1c',
          taste: '太い見出しで旅行ポスター風に。今のモックの組み合わせです。'
        },
        {
          key: '案1',
          name: 'ポップ＆キュート',
          display: "'Mochiy Pop One', sans-serif", dw: 400, displayName: 'Mochiy Pop One',
          body: "'Zen Maru Gothic', sans-serif", bodyName: 'Zen Maru Gothic',
          taste: '丸くて弾むような見出し。カプセルトイらしさが一番強く出ます。'
        },
        {
          key: '案2',
          name: '手書きのしおり',
          display: "'Yusei Magic', sans-serif", dw: 400, displayName: 'Yusei Magic',
          body: "'Zen Maru Gothic', sans-serif", bodyName: 'Zen Maru Gothic',
          taste: 'マーカーで書いた旅のしおり風。友だち同士のゆるさが出ます。'
        },
        {
          key: '案3',
          name: '駅サイン・きっぷ',
          display: "'Zen Kaku Gothic New', sans-serif", dw: 900, displayName: 'Zen Kaku Gothic New（Black）',
          body: "'Zen Kaku Gothic New', sans-serif", bodyName: 'Zen Kaku Gothic New',
          taste: '駅の案内板のような太ゴシック。すっきり大人っぽく、きっぷと相性◎。'
        },
        {
          key: '案4',
          name: 'レトロ旅雑誌',
          display: "'Kaisei Decol', serif", dw: 700, displayName: 'Kaisei Decol',
          body: "'Zen Kaku Gothic New', sans-serif", bodyName: 'Zen Kaku Gothic New',
          taste: '昔の観光ポスターや旅行雑誌のような明朝系。ノスタルジックな旅情。'
        },
        {
          key: '案5',
          name: 'ドット絵ゲーム',
          display: "'DotGothic16', sans-serif", dw: 400, displayName: 'DotGothic16',
          body: "'M PLUS Rounded 1c', sans-serif", bodyName: 'M PLUS Rounded 1c',
          taste: 'レトロゲームのドット文字。ガチャを「引く」遊び感を前面に。'
        }
      ]
    };
  }
}
</script>
</body>
</html>
