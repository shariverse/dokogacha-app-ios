<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <!--
    招待リンクの固定の OGP 画像（1200×630。06 の §4 の仮決め「固定画像・固定タイトル」）の元。
    backend/scripts/render-ogp-image.sh が Google Chrome のヘッドレスで撮り、hosting/public/assets/ogp.png に書き出す。
    色は docs/spec/design/tokens.json の値、フォントはアプリに同梱したもの（Dokogacha/Resources/Fonts）を使う。
  -->
  <style>
    @font-face {
      font-family: "Mochiy Pop One";
      src: url("../../../Dokogacha/Resources/Fonts/MochiyPopOne-Regular.ttf");
    }
    @font-face {
      font-family: "Zen Maru Gothic";
      font-weight: 900;
      src: url("../../../Dokogacha/Resources/Fonts/ZenMaruGothic-Black.ttf");
    }
    :root {
      --color-bg-base: #FFF7EE;
      --color-surface-card: #FFFFFF;
      --color-ink: #2B2118;
      --color-accent-secondary: #FFC93C;
      --color-capsule-0: #FF7A59;
      --color-capsule-1: #FFC93C;
      --color-capsule-2: #3CC9A0;
      --color-capsule-3: #4DA3FF;
      --color-capsule-4: #FF8FC7;
      --color-capsule-5: #9B7BFF;
    }
    html, body {
      margin: 0;
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: var(--color-bg-base);
    }
    .frame {
      position: absolute;
      inset: 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--color-surface-card);
      border: 6px solid var(--color-ink);
      border-radius: 40px;
      box-shadow: 0 12px 0 var(--color-ink);
    }
    .capsules {
      display: flex;
      gap: 22px;
      margin: 0 0 36px;
      padding: 0;
      list-style: none;
    }
    .capsules li {
      width: 52px;
      height: 52px;
      border: 5px solid var(--color-ink);
      border-radius: 999px;
    }
    .capsules li:nth-child(1) { background: var(--color-capsule-0); }
    .capsules li:nth-child(2) { background: var(--color-capsule-1); }
    .capsules li:nth-child(3) { background: var(--color-capsule-2); }
    .capsules li:nth-child(4) { background: var(--color-capsule-3); }
    .capsules li:nth-child(5) { background: var(--color-capsule-4); }
    .capsules li:nth-child(6) { background: var(--color-capsule-5); }
    .name {
      margin: 0;
      font-family: "Mochiy Pop One", sans-serif;
      font-size: 150px;
      line-height: 1.2;
      color: var(--color-ink);
    }
    .tagline {
      margin: 24px 0 0;
      padding: 10px 36px;
      font-family: "Zen Maru Gothic", sans-serif;
      font-weight: 900;
      font-size: 44px;
      color: var(--color-ink);
      background: var(--color-accent-secondary);
      border: 5px solid var(--color-ink);
      border-radius: 999px;
    }
  </style>
</head>
<body>
  <div class="frame">
    <ul class="capsules"><li></li><li></li><li></li><li></li><li></li><li></li></ul>
    <p class="name">ドコガチャ</p>
    <p class="tagline">みんなの「行きたい」で回す行き先ガチャ</p>
  </div>
</body>
</html>
