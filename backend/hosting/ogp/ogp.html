<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <!--
    招待リンクの固定の OGP 画像（1200×630。06 の §4 の仮決め「固定画像・固定タイトル」）の元。
    backend/scripts/render-ogp-image.sh が Google Chrome のヘッドレスで撮り、hosting/public/assets/ogp.png に書き出す。
    色は docs/spec/design/tokens.json の値、フォントはアプリに同梱したもの（Dokogacha/Resources/Fonts）を使う。
    アプリアイコンの絵は元データ（docs/design/app-icon/light.svg）をそのまま読む（アイコンを変えたら書き出し直す）。
  -->
  <style>
    @font-face {
      font-family: "Mochiy Pop One";
      src: url("../../../Dokogacha/Resources/Fonts/MochiyPopOne-Regular.ttf");
    }
    @font-face {
      font-family: "Zen Maru Gothic";
      font-weight: 900;
      src: url("../../../Dokogacha/Resources/Fonts/ZenMaruGothic-Black.ttf");
    }
    :root {
      --color-bg-base: #FFF7EE;
      --color-surface-card: #FFFFFF;
      --color-ink: #2B2118;
      --color-accent-secondary: #FFC93C;
    }
    html, body {
      margin: 0;
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: var(--color-bg-base);
    }
    .frame {
      position: absolute;
      inset: 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--color-surface-card);
      border: 6px solid var(--color-ink);
      border-radius: 40px;
      box-shadow: 0 12px 0 var(--color-ink);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 44px;
    }
    /* アプリアイコン（ホーム画面と同じく角を丸める。半径は一辺の 22.37%） */
    .icon {
      display: block;
      width: 232px;
      height: 232px;
      border: 6px solid var(--color-ink);
      border-radius: 52px;
      box-shadow: 0 10px 0 var(--color-ink);
    }
    .name {
      margin: 0;
      font-family: "Mochiy Pop One", sans-serif;
      font-size: 128px;
      line-height: 1.2;
      color: var(--color-ink);
    }
    .tagline {
      margin: 52px 0 0;
      padding: 10px 36px;
      font-family: "Zen Maru Gothic", sans-serif;
      font-weight: 900;
      font-size: 44px;
      color: var(--color-ink);
      background: var(--color-accent-secondary);
      border: 5px solid var(--color-ink);
      border-radius: 999px;
    }
  </style>
</head>
<body>
  <div class="frame">
    <div class="brand">
      <img class="icon" src="../../../docs/design/app-icon/light.svg" alt="">
      <p class="name">ドコガチャ</p>
    </div>
    <p class="tagline">みんなの「行きたい」で回す行き先ガチャ</p>
  </div>
</body>
</html>
